name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: borethm-workbench prepare
      - run: borethm-workbench contracts
      - run: git diff --exit-code -- contracts
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run types
        working-directory: frontend
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api.generated.ts frontend/package-lock.json
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BORETHM_CACHE_DIR: ${{ runner.temp }}/water-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-lock.txt
      - run: npm --prefix frontend ci
      - run: python deploy/build_release.py
      - name: Check wheel and generate release examples
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install -r requirements-lock.txt dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/deploy/verify_release.py" --data-dir "$RUNNER_TEMP/run-data" --output "$RUNNER_TEMP/installation.json"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/deploy/generate_examples.py" --output "$GITHUB_WORKSPACE/dist/examples"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-and-examples
          path: dist/
